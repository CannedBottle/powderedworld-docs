site_name: Powdered World Engine

site_url: https://cannedbottle.github.io/powderedworld-docs/

repo_url: https://github.com/CannedBottle/powdered_world_engine


theme:
  name: material

  favicon: img/PowderedWorldIcon.png
  logo: img/PowderedWorldIcon-black.png

  palette:
    scheme: slate

    primary: amber
    accent: light blue


plugins:
    - search

markdown_extensions:
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Navigation Home: index.md
  - Getting Started: getting_started.md
  - Tutorials:
      - The Element Creator Tab: Tutorials\element_creator_tab.md
      - Using PowderSimulation: Tutorials\using_powdersimulation.md
      - Making Custom ElementBehaviors: Tutorials\making_custom_elementbehaviors.md
      - FireBehavior Explanation: Tutorials\fire_behavior_explanation.md
  - Reference:
      - PowderSimulation: powdersimnode.md
      - SandInfo: sandinfo.md
      - WorldStreamer: worldstreamer.md
      - Elements: elements.md
      - Cell Functions: cell_class_functions.md
      - Save Order: saving+loading/save_order.md
  - About: about.md
